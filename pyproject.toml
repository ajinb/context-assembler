[project]
name = "context-assembler"
version = "0.1.0"
description = "A minimal, runnable reference for context engineering — typed segments, an enforced token budget, reranked selection, and compaction in one assembler you can read in a sitting."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
keywords = ["ai", "context-engineering", "agents", "rag", "llm", "context-window"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://cloudandsre.com"
Repository = "https://github.com/ajinb/context-assembler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_assembler"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
